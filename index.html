<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BeatCraft – Music Studio</title>
  <meta name="theme-color" content="#0b0b12">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎧 BeatCraft</h1>
    <div class="transport">
      <button id="btnImport">+ Import</button>
      <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      <button id="btnPlay" class="primary">▶</button>
      <button id="btnStop">■</button>
      <span id="time">0:00.0</span>
    </div>
  </header>

  <div class="toolbar">
    <button id="btnTrack">+ Track</button>
    <button id="btnSplit">✂ Split</button>
    <button id="btnMerge">⇢ Merge</button>
    <button id="btnOverlay">≋ Overlay</button>
    <button id="btnEdit">✏ Naam/Artist</button>
    <button id="btnDelete">🗑 Delete</button>
    <button id="btnMP3" class="primary">⬇ MP3</button>
    <button id="btnWAV">⬇ WAV</button>
  </div>

  <div class="timeline-wrap">
    <div id="timeline"></div>
  </div>

  <div class="inspector">
    <label>Volume <input type="range" id="volume" min="0" max="2" step="0.01" value="1"></label>
    <span id="selInfo">Clip tap karke select karein</span>
  </div>

  <div id="toast"></div>

  <!-- MP3 encoder -->
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
